name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      E2E_FAMILY_EMAIL: ${{ secrets.E2E_FAMILY_EMAIL }}
      E2E_FAMILY_PASSWORD: ${{ secrets.E2E_FAMILY_PASSWORD }}
      E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
      E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Needs the Supabase URL and key as repository secrets; skipped until they are set.
      - if: env.VITE_SUPABASE_URL != ''
        run: npx playwright install --with-deps chromium
      - if: env.VITE_SUPABASE_URL != ''
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
